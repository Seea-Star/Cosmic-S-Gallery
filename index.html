<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Gallery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .gallery-scroll-area { 
      max-height: 600px; 
      overflow-y: auto; 
      padding-right: 5px;
    }

    .gallery-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .gallery-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .gallery-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    /* Modalità Desktop: colonne multiple */
    .gallery-grid {
      column-count: 3;
      column-gap: 20px;
    }

    /* Modalità Telefono: una sola colonna, immagini una sotto l'altra */
    @media (max-width: 768px) {
      .gallery-grid {
        column-count: 1;
      }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
    }

    .gallery-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: none;
      box-shadow: none;
      filter: none;
      -webkit-touch-callout: none;
      pointer-events: auto;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>GALLERY</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <div class="gallery-scroll-area">
      <div class="gallery-grid">
        <div class="gallery-item"><img src="./Untitled Project (13).jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./20251107_165509.png" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./20251124_160453.png" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./Progetto senza titolo_20260827_215721_0000.png" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./20260708_211842.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./untitled project (13).jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
      </div>
    </div>

  </div>

</body>
</html>
