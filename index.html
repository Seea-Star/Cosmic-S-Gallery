<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Gallery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .gallery-scroll-area { 
      max-height: 600px; 
      overflow-y: auto; 
      padding-right: 5px;
    }

    .gallery-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .gallery-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .gallery-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    /* Modalità Desktop: colonne multiple */
    .gallery-grid {
      column-count: 3;
      column-gap: 20px;
    }

    /* Modalità Telefono: una sola colonna, immagini una sotto l'altra */
    @media (max-width: 768px) {
      .gallery-grid {
        column-count: 1;
      }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    }

    .gallery-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: none;
      box-shadow: none;
      filter: none;
      transition: filter 0.3s ease, transform 0.3s ease;
      -webkit-touch-callout: none;
      pointer-events: auto;
    }

    /* Effetto Hover specifico per l'immagine interattiva */
    .gallery-item.interactive:hover .gallery-img {
      filter: blur(6px) brightness(0.7);
      transform: scale(1.03);
    }

    .gallery-overlay-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(17, 17, 17, 0.85);
      color: #ffffff;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 12px;
      pointer-events: none;
    }

    .gallery-item.interactive:hover .gallery-overlay-card {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #F3EEDA;
      margin-bottom: 6px;
    }

    .overlay-text {
      font-size: 0.72rem;
      line-height: 1.4;
      font-weight: 600;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>GALLERY</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <div class="gallery-scroll-area">
      <div class="gallery-grid">
        <div class="gallery-item"><img src="./a3e910bf-f488-4cf1-aae8-248de7c4fb7c_20260827_224924_0000.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./bc11eaa4-c3ca-4038-bbe0-3e8ed2e74c45_20260827_225003_0000.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        
        <!-- Immagine con effetto interattivo (Untitled Project (13).jpg) -->
        <div class="gallery-item interactive">
          <img src="./Untitled Project (13).jpg" alt="Day and Night Art" class="gallery-img" oncontextmenu="return false;">
          <div class="gallery-overlay-card">
            <div class="overlay-title">Day & Night (Inspiration)</div>
            <p class="overlay-text">
              Originally created as a middle school project inspired by René Magritte's style. I later redesigned it digitally, playing with lighting and photo editing to merge two opposing realities into a single scene!
            </p>
          </div>
        </div>

        <div class="gallery-item"><img src="./6595c956-4a64-44bc-96a9-246b6257276e_20260827_224000_0000.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./e409e28d-e968-4aac-9160-838b74ea61cb_20260827_223219_0000.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./94611894-fbf6-4adc-aebe-7396d4784e2f_20260827_223201_0000.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./3_20260827_231708_0002.png" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
        <div class="gallery-item"><img src="./be80fdf0-c972-424b-9121-13691214e531_20260827_223055_0000.jpg" alt="Gallery Photo" class="gallery-img" oncontextmenu="return false;"></div>
      </div>
    </div>

  </div>

</body>
</html>
