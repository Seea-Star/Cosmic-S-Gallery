<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Gallery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .gallery-scroll-area { 
      max-height: 600px; 
      overflow-y: auto; 
      padding-right: 5px;
    }

    .gallery-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .gallery-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .gallery-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      align-items: center;
    }

    .gallery-item {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      height: 180px;
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: none;
      box-shadow: none;
      filter: none;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover .gallery-img {
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>GALLERY</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <div class="gallery-scroll-area">
      <div class="gallery-grid">
        <!-- Immagini in formato JPG e PNG presenti nei tuoi screenshot -->
        <div class="gallery-item"><img src="20250908_225608.png" alt="Gallery Photo" class="gallery-img"></div>
        <div class="gallery-item"><img src="20251107_165509.png" alt="Gallery Photo" class="gallery-img"></div>
        <div class="gallery-item"><img src="20251124_160453.png" alt="Gallery Photo" class="gallery-img"></div>
        <div class="gallery-item"><img src="20260603_140731.jpg" alt="Gallery Photo" class="gallery-img"></div>
        <div class="gallery-item"><img src="20260708_211842.jpg" alt="Gallery Photo" class="gallery-img"></div>
        <div class="gallery-item"><img src="untitled project (13).jpg" alt="Gallery Photo" class="gallery-img"></div>
      </div>
    </div>

  </div>

</body>
</html>
